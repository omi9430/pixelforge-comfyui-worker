name: Build and push worker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The base image is ~11GB; standard runners only have ~14GB free,
      # which isn't enough headroom to pull + extract it. Reclaim space
      # from preinstalled toolchains (.NET, Android SDK, GHC, etc.) we
      # don't use in this build.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # A per-commit tag alongside :latest — RunPod (or any registry
          # client) can cache a mutable tag and silently keep serving an
          # old image. Point the endpoint at the SHA tag when debugging so
          # a "did my fix actually deploy?" question always has a clear answer.
          tags: |
            ghcr.io/${{ github.repository_owner }}/pixelforge-comfyui-worker:latest
            ghcr.io/${{ github.repository_owner }}/pixelforge-comfyui-worker:${{ github.sha }}
